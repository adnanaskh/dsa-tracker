          <h1>DSA Mastery Tracker & 60-Day Coding Interview Practice Course</h1>
          <p>Welcome to the ultimate Data Structures and Algorithms practice course and tracker designed for engineers preparing for FAANG, Big Tech, and Tier-1 software engineering interviews.</p>
          
          <h2>Curated 60-Day DSA Curriculum (305 Problems)</h2>
          <ul>
            <li><strong>Days 1–5: Arrays & Hashing</strong> — 25 Foundational problems (Two Sum, Group Anagrams, Kadane's Algorithm)</li>
            <li><strong>Days 6–10: Strings</strong> — 25 Core string algorithms (Valid Palindrome, Longest Substring, String Matching)</li>
            <li><strong>Days 11–13: Two Pointers</strong> — 15 Traversal patterns (3Sum, Container With Most Water, Trapping Rain Water)</li>
            <li><strong>Days 14–16: Sliding Window</strong> — 15 Optimization problems (Minimum Window Substring, Max Profit)</li>
            <li><strong>Days 17–19: Stack & Monotonic Stack</strong> — 15 Structural problems (Daily Temperatures, Largest Rectangle in Histogram)</li>
            <li><strong>Days 20–22: Binary Search</strong> — 15 Search space reduction techniques (Search in Rotated Array, Median of Two Sorted Arrays)</li>
            <li><strong>Days 23–26: Linked Lists</strong> — 20 Pointer manipulation problems (Reverse Linked List, Merge K Sorted Lists, LRU Cache)</li>
            <li><strong>Days 27–30: Binary Trees & BST</strong> — 20 Recursive & iterative traversal problems</li>
            <li><strong>Days 31–32: Tries (Prefix Trees)</strong> — 8 Word search and prefix matching problems</li>
            <li><strong>Days 33–35: Heaps & Priority Queues</strong> — 15 Top-K and streaming problems</li>
            <li><strong>Days 36–38: Backtracking</strong> — 15 Combinatorial search patterns (Subsets, Permutations, N-Queens)</li>
            <li><strong>Days 39–40: Intervals</strong> — 10 Meeting rooms and interval merging algorithms</li>
            <li><strong>Days 41–43: Greedy Algorithms</strong> — 15 Local optimization patterns</li>
            <li><strong>Days 44–49: Graphs & Shortest Paths</strong> — 30 BFS, DFS, Topological Sort, Dijkstra, and Union-Find problems</li>
            <li><strong>Days 50–56: Dynamic Programming (1D & 2D)</strong> — 35 Optimal substructure and memoization problems</li>
            <li><strong>Days 57–60: Bit Manipulation, Math & Sorting</strong> — 27 Finishing problems & grand finale review</li>
          </ul>

          <h2>Key Platform Features</h2>
          <ul>
            <li><strong>Spaced Repetition System (SRS)</strong>: Expanding intervals (1d, 3d, 7d, 14d, 30d) ensuring long-term pattern retention.</li>
            <li><strong>Syntax-Highlighted Solution Vault</strong>: Store your private solutions in Java, Python, C++, Go, Rust, or JavaScript.</li>
            <li><strong>GitHub-Style Heatmap</strong>: Track continuous daily practice streaks over 20 weeks.</li>
            <li><strong>Command Palette (Ctrl + K)</strong>: Instant search across 305 problems, patterns, and topics.</li>
            <li><strong>Global Leaderboard</strong>: Live rankings with real-time peer benchmarks and achievements.</li>
          </ul>
